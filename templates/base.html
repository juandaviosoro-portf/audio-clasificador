<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de clasificación automática de audios de clientes con inteligencia artificial">
    <title>{% block title %}AudioClasifica - IA{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- Estilos propios -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top glass-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <div class="brand-icon">
                    <i class="bi bi-soundwave"></i>
                </div>
                <span class="brand-text">AudioClasifica</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/" id="nav-inicio">
                            <i class="bi bi-mic-fill me-1"></i> Analizar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="/dashboard" id="nav-dashboard">
                            <i class="bi bi-graph-up me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'historial' %}active{% endif %}" href="/historial" id="nav-historial">
                            <i class="bi bi-clock-history me-1"></i> Historial
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center">
                    <button class="btn btn-link nav-link px-2" id="btn-toggle-tema" title="Cambiar tema" onclick="toggleTema()">
                        <i class="bi bi-moon-stars-fill" id="icono-tema"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer-section mt-auto">
        <div class="container text-center py-3">
            <small class="text-body-secondary">
                AudioClasifica &copy; {{ now().year if now is defined else '2026' }} &mdash; Clasificación inteligente de audio con IA
            </small>
        </div>
    </footer>

    <!-- Toast de notificaciones -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
        <div id="toast-notificacion" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toast-mensaje"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de tema -->
    <script>
        function toggleTema() {
            const html = document.documentElement;
            const iconoTema = document.getElementById('icono-tema');
            const temaActual = html.getAttribute('data-bs-theme');

            if (temaActual === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                iconoTema.className = 'bi bi-sun-fill';
                localStorage.setItem('tema', 'light');
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                iconoTema.className = 'bi bi-moon-stars-fill';
                localStorage.setItem('tema', 'dark');
            }
        }

        // Cargar tema guardado
        (function() {
            const temaGuardado = localStorage.getItem('tema') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', temaGuardado);
            const icono = document.getElementById('icono-tema');
            if (icono) {
                icono.className = temaGuardado === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            }
        })();
    </script>

    <!-- Scripts de página -->
    {% block scripts %}{% endblock %}
</body>
</html>
